<!DOCTYPE html>
<html lang="no">

<head>
    <title>IM nettside</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="terminal index.css">
    <link rel="stylesheet" href="https://use.typekit.net/nar4tne.css">
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            /* Klipp alt som havner utenfor skjermen, så siden ikke
               blir bredere/høyere og zoomer ut på telefon. */
            overflow: hidden;
        }
        body {
            background-image: url('Assets/bilder/bakgrunner/forside-uten-pc.jpg');
            background-size: cover;
            /* Fest bildet til bunnen: når "cover" må beskjære, kuttes
               alltid toppen - aldri bunnen. Så bordet er alltid synlig. */
            background-position: center bottom;
            background-attachment: fixed;
        }
        @media (max-width: 768px) {
            body {
                background-image: url('Assets/bilder/bakgrunner/forside-tlf-uten-pc.jpg');
            }
        }
        .main-assets {
            position: absolute;
            cursor: grab;
            user-select: none;
            display: block;
            transition: transform 0.1s ease;
            transform-origin: center;
            /* Bildene ligger over PC-en som standard. Når terminalen
               åpnes, løftes PC-en over alt (se terminal index.css). */
            z-index: 5000;
        }
        .main-assets:active {
            transform: scale(1.2);
            cursor: grabbing;
        }

        /* ============================================================
           PLASSERING AV BILDENE I prosjekt-grid

           Hvert bilde har en egen id (#grid-...). Standard-delen under
           gjelder PC/stor skjerm. Telefon-delen nederst (i media query)
           overstyrer plasseringen på liten skjerm.

           Endre top/left/right og max-width/max-height for å flytte og
           skalere et enkelt bilde. vw = prosent av skjermbredden,
           vh = prosent av skjermhøyden.
           ============================================================ */

        /* --- Standard (PC / stor skjerm) --- */
        #grid-film        { max-width: 18vw; max-height: 18vh; top: 30vh; left: 20vw; }
        #grid-galleri     { max-width: 20vw; max-height: 20vh; top: 10vh; right: 12vw; }
        #grid-bedrift1    { max-width: 18vw; max-height: 18vh; top: 50vh; left: 50vw; }
        #grid-bedrift2    { max-width: 18vw; max-height: 18vh; top: 70vh; left: 30vw; }
        #grid-flerkamera2 { max-width: 18vw; max-height: 18vh; top: 20vh; left: 70vw; }
        #grid-flerkamera1 { max-width: 18vw; max-height: 18vh; top: 60vh; left: 80vw; }
        #grid-gjennestad  { max-width: 18vw; max-height: 18vh; top: 38vh; left: 45vw; }
        #grid-imlan1      { max-width: 18vw; max-height: 18vh; top: 25vh; left: 40vw; }
        #grid-imlan2      { max-width: 18vw; max-height: 18vh; top: 45vh; left: 25vw; }
        #grid-itkode1     { max-width: 18vw; max-height: 18vh; top: 15vh; left: 55vw; }
        #grid-itkode2     { max-width: 18vw; max-height: 18vh; top: 35vh; left: 62vw; }
        #grid-filmplakat  { max-width: 18vw; max-height: 18vh; top: 30vh; left: 18vw; }
        #grid-media1      { max-width: 18vw; max-height: 18vh; top: 55vh; left: 38vw; }
        #grid-media2      { max-width: 18vw; max-height: 18vh; top: 75vh; left: 55vw; }
        #grid-media3      { max-width: 18vw; max-height: 18vh; top: 80vh; left: 15vw; }
        #grid-nettsiden   { max-width: 18vw; max-height: 18vh; top: 18vh; left: 30vw; }
        #grid-egetspill   { max-width: 18vw; max-height: 18vh; top: 65vh; left: 62vw; }

        /* --- Postit-lapper (PC / stor skjerm) --- */
        #postit-it            { max-width: 12vw; max-height: 12vh; top: 5vh;  left: 20vw;  }
        #postit-galleri       { max-width: 12vw; max-height: 12vh; top: 7vh;  left: 38vw; }
        #postit-grafisk       { max-width: 12vw; max-height: 12vh; top: 5vh;  left: 70vw; }
        #postit-internat      { max-width: 12vw; max-height: 12vh; top: 36vh; left: 16vw;  }
        #postit-medie         { max-width: 12vw; max-height: 12vh; top: 67vh; left: 34vw; }
        #postit-reklamer      { max-width: 12vw; max-height: 12vh; top: 40vh; left: 74vw; }
        #postit-lan           { max-width: 12vw; max-height: 12vh; top: 75vh; left: 5vw;  }
        #postit-praksis       { max-width: 12vw; max-height: 12vh; top: 70vh; left: 60vw; }

        /* --- Telefon (liten skjerm) --- */
        @media (max-width: 600px) {
            #grid-film        { max-width: 15vw; max-height: 15vh; top: 8vh;  left: 4vw;  right: auto; }
            #grid-galleri     { max-width: 15vw; max-height: 15vh; top: 8vh;  left: 52vw; right: auto; }
            #grid-bedrift1    { max-width: 15vw; max-height: 15vh; top: 30vh; left: 4vw;  right: auto; }
            #grid-bedrift2    { max-width: 15vw; max-height: 15vh; top: 30vh; left: 52vw; right: auto; }
            #grid-flerkamera2 { max-width: 15vw; max-height: 15vh; top: 52vh; left: 4vw;  right: auto; }
            #grid-flerkamera1 { max-width: 15vw; max-height: 15vh; top: 52vh; left: 52vw; right: auto; }
            #grid-gjennestad  { max-width: 15vw; max-height: 15vh; top: 74vh; left: 4vw;  right: auto; }
            #grid-imlan1      { max-width: 15vw; max-height: 15vh; top: 74vh; left: 52vw; right: auto; }
            #grid-imlan2      { max-width: 15vw; max-height: 15vh; top: 18vh; left: 28vw; right: auto; }
            #grid-itkode1     { max-width: 15vw; max-height: 15vh; top: 42vh; left: 28vw; right: auto; }
            #grid-itkode2     { max-width: 15vw; max-height: 15vh; top: 64vh; left: 28vw; right: auto; }
            #grid-filmplakat  { max-width: 15vw; max-height: 15vh; top: 20vh; left: 78vw; right: auto; }
            #grid-media1      { max-width: 15vw; max-height: 15vh; top: 42vh; left: 78vw; right: auto; }
            #grid-media2      { max-width: 15vw; max-height: 15vh; top: 64vh; left: 78vw; right: auto; }
            #grid-media3      { max-width: 15vw; max-height: 15vh; top: 86vh; left: 28vw; right: auto; }
            #grid-nettsiden   { max-width: 15vw; max-height: 15vh; top: 86vh; left: 52vw; right: auto; }
            #grid-egetspill   { max-width: 15vw; max-height: 15vh; top: 86vh; left: 4vw;  right: auto; }

            /* Postit-lapper på telefon */
            #postit-it            { max-width: 18vw; max-height: 18vh; top: 8vh;  left: 78vw; right: auto; }
            #postit-galleri       { max-width: 18vw; max-height: 18vh; top: 8vh;  left: 28vw; right: auto; }
            #postit-grafisk       { max-width: 18vw; max-height: 18vh; top: 30vh; left: 78vw; right: auto; }
            #postit-internat      { max-width: 18vw; max-height: 18vh; top: 30vh; left: 28vw; right: auto; }
            #postit-medie         { max-width: 18vw; max-height: 18vh; top: 52vh; left: 78vw; right: auto; }
            #postit-reklamer      { max-width: 18vw; max-height: 18vh; top: 52vh; left: 28vw; right: auto; }
            #postit-lan           { max-width: 18vw; max-height: 18vh; top: 74vh; left: 78vw; right: auto; }
            #postit-praksis       { max-width: 18vw; max-height: 18vh; top: 74vh; left: 28vw; right: auto; }
        }
    </style>
</head>
<body>
<div class="prosjekt-grid">
    <img id="grid-bedrift1" src="Assets/elementer/polaroids/bedriftLogo1V2.png" class="main-assets" alt="test">
    <img id="grid-bedrift2" src="Assets/elementer/polaroids/bedriftLogo2V2.png" class="main-assets" alt="test">
    <img id="grid-flerkamera2" src="Assets/elementer/polaroids/flerkameraproduksjon2V2.png" class="main-assets" alt="test">
    <img id="grid-flerkamera1" src="Assets/elementer/polaroids/flerkameraproduksjon1V2.png" class="main-assets" alt="test">
    <img id="grid-gjennestad" src="Assets/elementer/polaroids/GjennestadV2.png" class="main-assets" alt="test">
    <img id="grid-imlan1" src="Assets/elementer/polaroids/IMLan1V2.png" class="main-assets" alt="IM LAN">
    <img id="grid-imlan2" src="Assets/elementer/polaroids/IMLan2V2.png" class="main-assets" alt="IM LAN">
    <img id="grid-itkode1" src="Assets/elementer/polaroids/ITkode1.png" class="main-assets" alt="IT kode">
    <img id="grid-itkode2" src="Assets/elementer/polaroids/ITkode2.png" class="main-assets" alt="IT kode">
    <img id="grid-filmplakat" src="Assets/elementer/polaroids/filmplakat1V2.png" class="main-assets" alt="Filmplakat">
    <img id="grid-media1" src="Assets/elementer/polaroids/mediaproduksjon1V2.png" class="main-assets" alt="Mediaproduksjon">
    <img id="grid-media2" src="Assets/elementer/polaroids/mediaproduksjon2.png" class="main-assets" alt="Mediaproduksjon">
    <img id="grid-media3" src="Assets/elementer/polaroids/mediaproduksjon3.png" class="main-assets" alt="Mediaproduksjon">
    <img id="grid-nettsiden" src="Assets/elementer/polaroids/nettsiden1.png" class="main-assets" alt="Nettsiden">
    <img id="grid-egetspill" src="Assets/elementer/polaroids/polaroidEgetSpill1V2.png" class="main-assets" alt="Eget spill">

    <!-- Postit-lapper. data-link styrer hvilken side lappen leder til. -->
    <img id="postit-it" src="Assets/elementer/postit notes/IT.png" class="main-assets" data-link="it-side.html?id=Informasjonsteknologi" alt="IT">
    <img id="postit-galleri" src="Assets/elementer/postit notes/galleri.png" class="main-assets" data-link="galleri.html" alt="Galleri">
    <img id="postit-grafisk" src="Assets/elementer/postit notes/grafiskDesign.png" class="main-assets" data-link="grafisk-design.html?id=Grafisk-Design" alt="Grafisk design">
    <img id="postit-internat" src="Assets/elementer/postit notes/internatGjennestad.png" class="main-assets" data-link="film-rull.html?id=Internat og Gjennestad" alt="Internat og Gjennestad">
    <img id="postit-medie" src="Assets/elementer/postit notes/medie.png" class="main-assets" data-link="media.html?id=media" alt="Media">
    <img id="postit-reklamer" src="Assets/elementer/postit notes/reklamer.png" class="main-assets" data-link="Reklamefilm.html?id=Reklamefilm" alt="Reklamer">
    <img id="postit-praksis" src="Assets/elementer/postit notes/praksis.png" class="main-assets" data-link="film-rull.html?id=Praksis" alt="Praksis">
</div>
<script src="script.js"></script>
<script src="prosjekter.js"></script>
<script src="terminal.js"></script>
<script src="kommandoer.js"></script>

<script>
    const img = document.querySelectorAll('.main-assets')
    let isDragging = false;
    let currentImage = null;
    let offsetX, offsetY;
    let maxZ = 5000;
    let mouseHasMoved = false;
    let imgLink = null;

    function startDrag(img, clientX, clientY) {
        isDragging = true;
        mouseHasMoved = false;
        imgLink = img.dataset.link;
        maxZ += 1;
        currentImage = img;
        currentImage.style.zIndex = maxZ;
        offsetX = clientX - img.getBoundingClientRect().left;
        offsetY = clientY - img.getBoundingClientRect().top;
        document.body.style.cursor = 'grabbing';
        currentImage.style.cursor = 'grabbing';
    }

    function moveDrag(clientX, clientY) {
        if (isDragging && currentImage) {
            mouseHasMoved = true;

            let nyLeft = clientX - offsetX;
            let nyTop = clientY - offsetY;

            // Hold bildet innenfor skjermen, så det aldri havner utenfor
            // (og dermed ikke gjør siden bredere / zoomer ut på telefon).
            const maxLeft = window.innerWidth - currentImage.offsetWidth;
            const maxTop = window.innerHeight - currentImage.offsetHeight;
            nyLeft = Math.max(0, Math.min(nyLeft, maxLeft));
            nyTop = Math.max(0, Math.min(nyTop, maxTop));

            // Bytt fra eventuell right/vw-plassering til ren px-styring
            currentImage.style.right = 'auto';
            currentImage.style.left = nyLeft + 'px';
            currentImage.style.top = nyTop + 'px';
        }
    }

    function endDrag() {
        if (!mouseHasMoved && imgLink) {
            console.log(imgLink);
            window.location.assign(imgLink);
        }
        isDragging = false;
        // reset cursors
        document.body.style.cursor = '';
        img.forEach(i => i.style.cursor = 'grab');
        currentImage = null;
    }

    img.forEach(img => {
        img.addEventListener('mousedown', (e) => {
            startDrag(img, e.clientX, e.clientY);
            e.preventDefault();
        });
        img.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            startDrag(img, touch.clientX, touch.clientY);
            e.preventDefault();
        }, { passive: false });
    });

    document.addEventListener('mousemove', (e) => {
        moveDrag(e.clientX, e.clientY);
    });

    document.addEventListener('touchmove', (e) => {
        if (isDragging && currentImage) {
            const touch = e.touches[0];
            moveDrag(touch.clientX, touch.clientY);
            e.preventDefault();
        }
    }, { passive: false });

    document.addEventListener('mouseup', endDrag);
    document.addEventListener('touchend', endDrag);
</script>
</body>

</html>
