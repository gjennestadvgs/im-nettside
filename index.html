        .main-assets {
            position: absolute;
            cursor: grab;

        }

        .main-assets {

        }

<body>
<div class="prosjekt-grid">
    <img src="Assets\bilder/1IM_2026_17.JPG" class="main-assets"
            style="max-width:30vw;max-height:30vh; top: 60vh; left: 80vw" alt="test">
    <img src="Assets\bilder/1IM_2026_20.JPG" class="main-assets"
            style="max-width:30vw;max-height:30vh; top: 60vh; left: 80vw" alt="test">
    <img src="Assets\bilder/1IM_2026_15.JPG" class="main-assets"
            style="max-width:30vw;max-height:30vh; top: 60vh; left: 80vw" alt="test">
    <img src="Assets\bilder/1IM_2026_14.JPG" class="main-assets"
            style="max-width:30vw;max-height:30vh; top: 60vh; left: 80vw" alt="test">
    <img src="Assets\bilder/1IM_2026_1.jpg" class="main-assets"
            style="max-width:30vw;max-height:30vh; top: 60vh; left: 80vw" alt="test">
    <img src="Assets\bilder\test-bilde.jpg" class="main-assets"
            style="max-width:30vw;max-height:30vh; top: 60vh; left: 80vw" alt="test">
    <img src="Assets\bilder\Filmplakat_above-the-law.jpg" class="main-assets"
            style="max-width:25vw;max-height:25vh; top: 10vh; left: 5vw" alt="test">
    <img src="Assets\bilder/cff7d820e97b36e66dde6e52936a7d37.png" class="main-assets" data-link="polaroid.html?id=test-id"
            style="max-width:22vw;max-height:22vh; top: 10vh; left: 5vw" alt="test">
    <img src="Assets\bilder/dfc920ed0e5776d4450e18b812232729.png" class="main-assets" data-link="galleri.html"
            style="max-width:22vw;max-height:22vh; top: 10vh; left: 5vw" alt="test">
</div>
<script src="script.js"></script>
<script src="prosjekter.js"></script>
<script src="terminal.js"></script>
<script src="kommandoer.js"></script>

<script>
    const img = document.querySelectorAll('.main-assets')
    let isDragging = false;
    let currentImage = null;
    let offsetX, offsetY;
    let maxZ = 1;
    let mouseHasMoved = false;
    let imgLink = null;

    img.forEach(img => {
        img.addEventListener('mousedown', (e) => {
            isDragging = true;
            mouseHasMoved = false;
            imgLink = img.dataset.link;
            maxZ += 1;
            currentImage = img;
            currentImage.style.zIndex = maxZ;
            offsetX = e.clientX - img.getBoundingClientRect().left;
            offsetY = e.clientY - img.getBoundingClientRect().top;
            currentImage.style.cursor = 'grabbing';
            document.body.style.cursor = 'grabbing';
            e.preventDefault();
        });
    });

    document.addEventListener('mousemove', (e) => {
        if (isDragging && currentImage) {
            mouseHasMoved = true;
            currentImage.style.left = (e.clientX - offsetX) + 'px';
            currentImage.style.top = (e.clientY - offsetY) + 'px';
        }
    });

    document.addEventListener('mouseup', () => {
        if (!mouseHasMoved && imgLink) {
            console.log(imgLink);
            window.location.assign(imgLink);
        }
        isDragging = false;
        // reset cursors
        document.body.style.cursor = '';
        img.forEach(i => i.style.cursor = 'grab');
        currentImage = null;
    })
</script>
</body>

</html>
