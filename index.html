<!DOCTYPE html>
<html lang="no">

<head>
    <title>IM nettside</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="terminal index.css">
    <link rel="stylesheet" href="https://use.typekit.net/nar4tne.css">
    <style>
        body {
            background-image: url('Assets/bilder/forside-backgrunn-remastered.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            margin: 0;
            overflow: hidden;
        }
        .main-assets {
            position: absolute;
            cursor: grab;
            user-select: none;
            display: block;
            transition: transform 0.1s ease;
            transform-origin: center;
        }
        .main-assets:active {
            transform: scale(1.2)
        }
    </style>
</head>
<body>
<div class="prosjekt-grid">
    <img src="Assets\bilder/cff7d820e97b36e66dde6e52936a7d37.png" class="main-assets" data-link="film-rull.html?id=Internat og Gjennestad"
            style="max-width:18vw;max-height:18vh; top: 30vh; left: 20vw" alt="test">
    <img src="Assets\bilder/dfc920ed0e5776d4450e18b812232729.png" class="main-assets" data-link="galleri.html"
            style="max-width:20vw;max-height:20vh; top: 10vh; right: 12vw" alt="test">
    <img src="Assets/elementer/polaroids/bedriftLogo1V2.png" class="main-assets"
            style="max-width:18vw;max-height:18vh; top: 50vh; left: 50vw" alt="test">
    <img src="Assets/elementer/polaroids/bedriftLogo2V2.png" class="main-assets"
            style="max-width:18vw;max-height:18vh; top: 70vh; left: 30vw" alt="test">
    <img src="Assets/elementer/polaroids/flerkameraproduksjon2V2.png" class="main-assets"
            style="max-width:18vw;max-height:18vh; top: 20  vh; left: 70vw" alt="test">
    <img src="Assets/elementer/polaroids/flerkameraproduksjon1V2.png" class="main-assets"
            style="max-width:18vw;max-height:18vh; top: 60vh; left: 80vw" alt="test">
    <img src="Assets/elementer/polaroids/gjennestadV2.png" class="main-assets"
            style="max-width:18vw;max-height:18vh; top: 60vh; left: 80vw" alt="test">
</div>
<script src="script.js"></script>
<script src="prosjekter.js"></script>
<script src="terminal.js"></script>
<script src="kommandoer.js"></script>

<script>
    const img = document.querySelectorAll('.main-assets')
    let isDragging = false;
    let currentImage = null;
    let offsetX, offsetY;
    let maxZ = 1;
    let mouseHasMoved = false;
    let imgLink = null;

    img.forEach(img => {
        img.addEventListener('mousedown', (e) => {
            isDragging = true;
            mouseHasMoved = false;
            imgLink = img.dataset.link;
            maxZ += 1;
            currentImage = img;
            currentImage.style.zIndex = maxZ;
            offsetX = e.clientX - img.getBoundingClientRect().left;
            offsetY = e.clientY - img.getBoundingClientRect().top;
            document.body.style.cursor = 'grabbing';
            e.preventDefault();
        });
    });

    document.addEventListener('mousemove', (e) => {
        if (isDragging && currentImage) {
            mouseHasMoved = true;
            currentImage.style.left = (e.clientX - offsetX) + 'px';
            currentImage.style.top = (e.clientY - offsetY) + 'px';
        }
    });

    document.addEventListener('mouseup', () => {
        if (!mouseHasMoved && imgLink) {
            console.log(imgLink);
            window.location.assign(imgLink);
        }
        isDragging = false;
        // reset cursors
        document.body.style.cursor = '';
        img.forEach(i => i.style.cursor = 'grab');
        currentImage = null;
    });
</script>
</body>

</html>
