<!DOCTYPE html>
<html lang="no">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Photobooth panel</title>
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; height: 100%; }
        body { font-family: Arial, Helvetica, sans-serif; color: initial; background: initial; }

        /* Tre-soners layout: venstre (knapper), midten (print), høyre (info) */
        .page { min-height: 100vh; padding: 16px; }
        .panel-shell { display: grid; grid-template-columns: 260px 1fr 280px; gap: 12px; height: calc(100vh - 32px); }

        /* Sonene holdes helt nøytrale: ingen border, ingen bakgrunn */
        .zone { background: transparent; border: none; box-shadow: none; padding: 12px; }

        /* Kodelås: tett rutenett med taster */
        .project-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .project-key { padding: 10px; cursor: pointer; background: transparent; border: none; text-align: left; }

        /* Stor knapp men uten farge eller border */
        .red-button-wrap { margin-top: 14px; display: flex; justify-content: center; }
        .print-button { width: 100%; min-height: 88px; border-radius: 50%; background: transparent; border: none; cursor: pointer; }

        /* Midtsonen: print-slot uten dekorasjoner */
        .print-slot { width: min(100%, 520px); min-height: 420px; background: transparent; padding: 12px; }
        .paper { background: transparent; color: inherit; border: none; opacity: 0; transform: translateY(-8px) scale(0.98); transition: transform 200ms ease, opacity 200ms ease; }
        .paper.visible { opacity: 1; transform: translateY(0) scale(1); }

        /* Høyre panel: enkel info - teksten fjernes hvor ønsket */
        .info-block { padding: 12px; background: transparent; border: none; }
        .info-block h1 { margin: 0 0 8px; font-size: 1.4rem; }

        /* Responsivt: stabler panelene på små skjermer */
        @media (max-width: 980px) { .panel-shell { grid-template-columns: 1fr; } }
    </style>
</head>

<body>
    <main class="page">
        <section class="panel-shell" aria-label="Photobooth kontrollpanel">
            <aside class="zone left-panel">
                <!-- Kodelås - beholdes som før, men uten etiketttekst -->
                <div class="project-grid" id="projectButtons"></div>
                <div class="red-button-wrap">
                    <!-- Rød knapp beholdes i funksjon, men uten farge/border -->
                    <button class="print-button" id="printButton" type="button">Print</button>
                </div>
            </aside>

            <section class="zone center-panel">
                    <!-- Papiret som vises ved print; innhold settes av JS -->
                    <div class="paper" id="paperOutput" aria-live="polite"></div>
                </div>
            </section>

            <aside class="zone right-panel">
                <!-- Prosjektinfo: etikett fjernet, prosjektkode fjernet fra visning -->
                <div class="info-block">
                    <h1 id="projectTitle">Velg en knapp</h1>
                    <p id="projectText">Trykk på en knapp til venstre for å se kort info her.</p>
                </div>
            </aside>
        </section>
    </main>

    <script>
        // Lokale prosjektdata (id, title, text og bilder)
        const projects = [
            { id: 'test-id', title: 'test', text: 'Et enkelt testprosjekt.', images: ['Assets/bilder/Filmplakat_above-the-law.jpg', 'Assets/bilder/test-bilde.jpg'] },
            { id: 'layout', title: 'layout', text: 'Struktur og flater.', images: ['Assets/bilder/Uten navn.png', 'Assets/bilder/sticky-note.png'] },
            { id: 'poster', title: 'poster', text: 'Plakat og visning.', images: ['Assets/bilder/Filmplakat_above-the-law.jpg'] }
        ];

        // DOM-referanser
        const projectButtons = document.getElementById('projectButtons');
        const printButton = document.getElementById('printButton');
        const printHint = document.getElementById('printHint');
        const paperOutput = document.getElementById('paperOutput');
        const projectTitle = document.getElementById('projectTitle');
        const projectText = document.getElementById('projectText');

        let activeProjectIndex = 0;

        // Generer knappene i kodelåsen
        function renderButtons() {
            projectButtons.innerHTML = projects.map((p, i) => `
                <button class="project-key ${i === activeProjectIndex ? 'active' : ''}" data-index="${i}">
                    <span class="key-number">0${i+1}</span>
                    <span class="key-title">${p.title}</span>
                </button>
            `).join('');

            // Legg til click-handlere
            projectButtons.querySelectorAll('.project-key').forEach(btn => {
                btn.addEventListener('click', () => {
                    activeProjectIndex = Number(btn.dataset.index);
                    updateInfo();
                    clearPrint();
                    renderButtons();
                });
            });
        }

        // Oppdater høyre panel (kun tittel og kort tekst)
        function updateInfo() {
            const p = projects[activeProjectIndex];
            projectTitle.textContent = p.title;
            projectText.textContent = p.text;
        }

        // Fjern papir/print fra midtsonen
        function clearPrint() {
            paperOutput.classList.remove('visible');
            paperOutput.innerHTML = '';
            printHint.textContent = '';
        }

        // Vis papir med bilder ved print
        function doPrint() {
            const p = projects[activeProjectIndex];
            paperOutput.innerHTML = `
                <div class="paper-header"><h2>${p.title}</h2><p>${p.text}</p></div>
                <div class="paper-grid">
                    ${p.images.map((s, i) => `<figure class="photo"><img src="${s}" alt="${p.title} ${i+1}"><figcaption class="photo-label">${i+1}</figcaption></figure>`).join('')}
                </div>
            `;
            paperOutput.classList.add('visible');
            printHint.textContent = '';
        }

        printButton.addEventListener('click', doPrint);

        renderButtons();
        updateInfo();
        clearPrint();
    </script>
</body>

</html>
