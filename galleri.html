<!DOCTYPE html>
<html lang="no">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Galleri</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="terminal.css">
    <link rel="stylesheet" href="https://use.typekit.net/nar4tne.css">
    <style>
        :root {
            --grabber-width: 400px;
        }
        body {
            padding: 20px;
            height: 100vh;
            color: var(--background-color);
            color: var(--text-color);
            overflow: hidden;
        }

        .page {
            height: 100vh;
            padding: 16px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .panel-shell {
            width: min(1440px, 100%);
            height: 100%;
            max-height: calc(100vh - 32px);
            display: grid;
            grid-template-columns: minmax(240px, 300px) minmax(0, 1fr) minmax(260px, 330px);
            /* Tving den ene raden til å fylle hele høyden. Uten dette blir raden
               like høy som innholdet (senterpanelet er absolutt-posisjonert = 0 høyt),
               slik at panelene ikke fyller skjermen og screentastic ikke flukter med teksten. */
            grid-template-rows: minmax(0, 1fr);
            gap: 18px;
            align-items: stretch;
            overflow: hidden;
        }

        .left-panel,
        .right-panel,
        .center-panel {
            position: relative;
            overflow: hidden;
        }

        .left-panel {
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            min-height: 0;
        }

        /* Skyv etiketten til høyre for den faste tilbake-knappen (som vokser med
           skjermen) så de ikke overlapper. Nullstilles på mobil der knappen ligger
           over logoen i stedet. */
        .panel-label {
            padding-left: clamp(46px, 4.8vw, 92px);
            font-size: clamp(0.95rem, 1.3vw, 1.7rem); /* Vokser med skjermbredden */
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 2px;
        }

        .project-key {
            aspect-ratio: 1/1;
            width: 100%;       /* Endret: Bruker full bredde i rutenettet sitt */
            max-width: 110px;   /* Sørger for at den ikke blir for stor på PC */
            height: auto;
            border: none;
            border-radius: 0;
            background-color: transparent;
            background-position: center center;
            background-repeat: no-repeat;
            background-size: 100% 100%; /* Sørger for at bildefilen strekker seg riktig */
            color: var(--text-color);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6px;
            gap: 4px;
            transition: transform 150ms ease, box-shadow 150ms ease, border-color 150ms ease;
            font: inherit;
        }
        

        .project-key.is-selected {
            transform: translateY(-1px);
        }

        .key-number {
            font-size: 1.4rem;
            font-weight: 800;
            line-height: 1;
            margin: 0;
        }

        .key-label {
            display: block;
            font-size: clamp(0.8rem, 1vw, 1.25rem); /* Vokser med skjermbredden */
            text-transform: none;
            letter-spacing: 0.02em;
            white-space: normal;
            text-align: center;
            margin-top: 6px;
            color: var(--text-color);
        }

        .key-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 4px;
        }

        .lock-display {
            min-height: 2.8rem;
            border-radius: 999px;
            border: 1px solid rgba(36, 28, 23, 0.18);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            letter-spacing: 0.08em;
            text-indent: 0;
            cursor: pointer;
            font: inherit;
            color: var(--text-color);
            transition: transform 150ms ease, box-shadow 150ms ease, border-color 150ms ease;
        }

        .lock-display:hover,
        .lock-display:focus-visible {
            transform: translateY(-1px);
            box-shadow: 0 10px 18px rgba(33, 24, 18, 0.12);
            outline: none;
        }

        .print-button {
            min-height: 2.8rem;
            border-radius: 999px;
            border: 2px solid rgba(36, 28, 23, 0.18);
            background: rgba(188, 5, 5, 0.82);
            color: var(--secondary-text-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            cursor: pointer;
            font: inherit;
            box-shadow: 0 12px 20px rgba(33, 24, 18, 0.14);
            transition: transform 150ms ease, box-shadow 150ms ease, filter 150ms ease;
        }

        .print-button:hover,
        .print-button:focus-visible {
            transform: translateY(-1px);
            box-shadow: 0 16px 24px rgba(33, 24, 18, 0.18);
            filter: brightness(1.03);
            outline: none;
        }

        .center-panel {
            min-height: 0;
        }

        .paper-container {
            position: absolute;
            inset: 0;
            padding: 14px;
            box-sizing: border-box;
        }

        .picture-grabber {
            position: absolute;
            top: 270px;
            left: 50%;
            transform: translateX(-50%);
            width: min(300px, 65%);
            z-index: 3;
            pointer-events: none;
            filter: drop-shadow(0 16px 28px rgba(33, 24, 18, 0.24));
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .picture-grabber img {
            display: block;
            width: 100%;
            height: auto;
        }

        .picture-grabber img.grabber-logo {
            position: absolute;
            top: -275px;
            left: 50%;
            transform: translateX(-50%);
            width: 280px !important;
            height: auto !important;
            z-index: 4;
        }

        /* CONTAINEREN SOM HOLDER ALT UT-PRINTET INNHOLD */
        .paper {
            z-index: 4; /* Sortert under grabberen (z-index 3) så arket kommer *ut* av maskinen */
            position: absolute;
            top: 350px; 
            left: 14px;
            width: calc(100% - 28px); 
            bottom: 20px; /* Strekker seg helt ned til bunnen av panelet */
            display: flex;
            align-items: flex-start;
            justify-content: center; 
            overflow: hidden; 
        }

        /* GRID-SYSTEMET SOM RAMMER INN BILDET */
        .paper-grid {
            width: 100%;
            max-width: 400px; 
            height: 100%; /* Låser høyden til ramma */
            display: grid;
            grid-template-columns: 1fr; 
            gap: 14px;
            justify-items: center; 
            align-items: start;
            align-content: start;
            overflow: hidden; /* Forhindrer at griddet utvider seg */
            margin: 0 auto;
        }

        /* DEN INTERNE RULLEBOKSEN FOR BILDET */
        .photo {
            margin: 0;
            width: 280px;          
            height: 100%; /* Fyller den tilgjengelige skjermhøyden i griddet */
            display: block;        
            overflow-y: auto; /* Gir kun denne boksen lov til å scrolle! */
            position: relative;
        }

        /* SELVE BILDET (Fikser den voldsomme zoomen) */
        .photo img {
            width: 100%; /* Tvinger bildet til å holde seg innenfor de 280 pikslene */
            height: auto; /* Beholder riktig bilde-proposjon */
            display: block;
            object-fit: contain;
            border-radius: 0;
            box-shadow: 0 18px 35px rgba(33, 24, 18, 0.18);
            transition: transform 600ms cubic-bezier(.2,.8,.2,1), opacity 400ms ease;
        }
        
        .paper-empty {
            text-align: center;
            max-width: 28rem;
            color: rgba(36, 28, 23, 0.75);
            line-height: 1.55;
        }

        .right-panel {
            padding: 16px;
            min-height: 0;
        }

        .info-block {
            position: relative;
            height: 100%;
            min-height: 0;
            overflow: hidden;
        }

        .info-overlay {
            position: absolute;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            filter: drop-shadow(0 16px 28px rgba(33, 24, 18, 0.18));
        }

        .info-overlay img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: fill;
        }

        .info-content {
            position: relative;
            z-index: 2;
            height: 100%;
            /* Sider/bunn følger det hvite feltet i screentastic.svg (~4,2 % sider).
               Topp-paddingen vokser med skjermhøyden via clamp(vh) – liten på små
               skjermer, større jo større skjermen blir (med et tak). flex-start
               holder teksten forankret rett under denne toppmargen. */
            padding: clamp(18px, 6vh, 90px) 9% 7%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            text-align: left;
        }

        .info-content h1 {
            margin: 0 0 8px;
            font-size: clamp(1.4rem, 2.6vw, 2.8rem); /* Vokser med skjermbredden */
            line-height: 0.98;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--secondary-text-color);
        }

        .info-content p {
            margin: 0;
            max-width: 22rem;
            font-size: clamp(1rem, 1.3vw, 1.6rem); /* Vokser med skjermbredden */
            line-height: 1.65;
            color: var(--secondary-text-color);
        }

        .project-key.is-selected {
            background-image: url('Assets/elementer/buttonMachineYesPressed.svg');
            transform: translateY(-1px);
        }
        /* Stor logo som kun vises på toppen på mobil */
        .top-logo {
            display: none;
        }

        /* Tilbake- og terminal-knappen vokser med skjermbredden (clamp).
           Scoped til galleri-siden så de delte stilene ikke endres for andre sider. */
        .back-button--fixed {
            width: clamp(50px, 4.5vw, 96px);
            height: clamp(50px, 4.5vw, 96px);
        }
        #terminal-knapp {
            width: clamp(50px, 4.5vw, 96px);
            height: clamp(50px, 4.5vw, 96px);
            font-size: clamp(18px, 1.6vw, 34px);
        }

        /* STORE SKJERMER: la siden bruke mer av plassen og skaler opp innholdet
           så det ikke blir liggende smått midt på med tomme felter rundt. */
        @media (min-width: 1400px) {
            .panel-shell {
                width: min(1900px, 94vw); /* Bruker mer av brede skjermer */
                gap: 28px;
                grid-template-columns: minmax(320px, 420px) minmax(0, 1fr) minmax(340px, 440px);
            }
            .keypad {
                gap: 2px; /* Mindre mellomrom mellom knappene */
            }
            .project-key {
                max-width: 150px; /* Større knapper */
            }
            .key-number {
                font-size: 1.8rem;
            }
            .print-button,
            .lock-display {
                min-height: 3.4rem;
                font-size: 1.05rem;
            }
            /* Større utprinter og bilde så midten fylles bedre.
               Logoen beholder sin opprinnelige plassering (-275px) så den
               ikke klippes av panelets overflow. */
            .picture-grabber {
                width: min(420px, 58%);
            }
            .paper {
                top: 380px;
            }
            .paper-grid {
                max-width: 520px;
            }
            .photo {
                width: 380px;
            }
        }

        /* NETTBRETT OG MINDRE DATASKJERMER */
        @media (max-width: 1080px) {
            .panel-shell {
                grid-template-columns: minmax(180px, 220px) minmax(0, 1fr) minmax(220px, 280px);
                gap: 12px;
            }
            .project-key {
                max-width: 70px; /* Krymper knappene litt */
            }
            .key-label {
                font-size: 0.65rem;
            }
        }

        /* MOBILTELEFONER (Skjermer under 680px) */
        @media (max-width: 680px) {
            body {
                padding: 8px; /* Mindre luft rundt skjermen */
            }

            .page {
                padding: 4px;
            }

            /* Mobil-layout:
               1) stor logo øverst, 2) knapper til venstre med tekst ved siden av,
               3) picturegrabber nederst. minmax(0,1fr) lar bilderaden krympe så
               alt får plass uten scroll. */
            .panel-shell {
                grid-template-columns: 1fr 1fr; /* Knapper og tekst deler bredden likt */
                grid-template-rows: auto auto minmax(0, 1fr);
                grid-template-areas:
                    "logo   logo"
                    "left   right"
                    "center center";
                gap: 8px 12px;
                align-items: start;
                height: 100%;
                max-height: calc(100vh - 16px);
                min-height: 0;
            }

            .top-logo {
                display: block;
                grid-area: logo;
                justify-self: center;
                width: clamp(120px, 40vw, 190px);
                height: auto;
                margin-top: 2px;
                filter: drop-shadow(0 6px 12px rgba(33, 24, 18, 0.18));
            }

            /* Knappene til venstre */
            .left-panel {
                grid-area: left;
                padding: 10px;
                gap: 8px;
            }
            .keypad {
                gap: 6px;
            }
            .project-key {
                max-width: none; /* Lar knappene vokse så de fyller sin halvdel av skjermen */
            }
            .key-label {
                display: none; /* Skjuler teksten under knappene på mobil for å spare kritisk plass */
            }
            .panel-label {
                font-size: 0.75rem;
                padding-left: 0; /* På mobil ligger knappen over logoen, ikke etiketten */
            }

            /* Teksten ved siden av knappene */
            .right-panel {
                grid-area: right;
                padding: 0;
                min-height: auto;
            }
            .info-block {
                height: auto;
            }
            .info-content {
                padding: 12px; /* Mye mindre padding så tekst ikke tar opp hele skjermen */
            }
            .info-content h1 {
                font-size: 1.1rem;
                margin-bottom: 2px;
                color: var(--text-color);
            }
            .info-content p {
                font-size: 0.85rem;
                line-height: 1.4;
                max-width: 100%;
                color: var(--text-color);
            }
            .info-overlay {
                display: none; /* Fjerner det tunge SVG-bakgrunnsbildet på mobil */
            }

            /* Picturegrabber nederst */
            .center-panel {
                grid-area: center;
                min-height: 0; /* Lar panelet krympe så alt får plass uten scroll */
                height: 100%; /* Fyller resten av skjermhøyden */
            }
            .picture-grabber {
                top: 10px; /* Flytter mekanismen helt opp til toppen av det nederste panelet */
                width: min(85%, 280px); /* Større utprinter på mobil */
            }
            .picture-grabber img.grabber-logo {
                display: none; /* Skjuler logoen over grabberen på mobil for å unngå krasj med infoboksen */
            }

            /* Justerer arket slik at det kommer ut rett under grabberen */
            .paper {
                top: 70px;
                left: 0;
                width: 100%;
                bottom: 5px;
            }
            .paper-grid {
                max-width: 320px;
            }
            .photo {
                width: min(80%, 280px); /* Bildet matcher den større mobil-grabberen */
            }

            /* Print-knappen fyller bredden under knapperutenettet */
            .print-button {
                width: 100%;
                min-height: 2.2rem;
                font-size: 0.8rem;
            }
        }
    </style>
</head>

<body>
    <main class="page">
        <section class="panel-shell" aria-label="Galleri med kodelås">
            <img src="Assets/elementer/stealOfApproval.png" class="top-logo" alt="Emblem">
            <aside class="zone left-panel" aria-label="Kodelås">
                <div class="panel-label">Prosjektvalg</div>
                <div class="keypad" id="projectButtons" aria-label="Tastatur med ni knapper"></div>
                <button class="print-button" id="printButton" type="button">Print</button>
            </aside>

            <section class="zone center-panel" aria-label="Bildevisning">
                <div class="paper-container">
                    <div class="picture-grabber" aria-hidden="true">
                        <img src="Assets/elementer/stealOfApproval.png" class="grabber-logo" alt="Emblem">

                        <img src="Assets/elementer/pictureGrabber.svg" alt="">
                    </div>
                    <div class="paper" id="paperOutput" aria-live="polite">
                        <div class="paper-empty">
                            Skriv inn en kode på venstre side for å få bildene til å gli ut fra pictureGrabber-mekanismen.
                        </div>
                    </div>
                </div>
            </section>

            <aside class="zone right-panel" aria-label="Informasjon">
                <div class="info-block">
                    <div class="info-overlay" aria-hidden="true">
                        <img src="Assets/elementer/screentastic.svg" alt="">
                    </div>
                    <div class="info-content">
                        <h1 id="projectTitle">Velg en kode</h1>
                        <p id="projectText">Bruk knappene til venstre for å låse opp et prosjekt og vise bildene i midten.</p>
                    </div>
                </div>
            </aside>
        </section>
    </main>

    <script>
        const projects = [
            { id: 'p1', title: 'GVGS Lan', text: 'Vi rigger og arrangerer vårt eget gaming-event! Her styrer vi alt selv – fra nettverk og servere til lys, lyd og turneringer.'
            , images: ['Assets\\elementer\\photo strip\\lan-foto-strip.png'], buttonLabel: '1' },
            { id: 'p2', title: 'Logodesign', text: 'Her leker vi oss med visuell identitet. Vi lærer å utvikle ideer fra skisseblokka til ferdige logoer som ser proffe ut.'
            , images: ['Assets\\elementer\\photo strip\\logo-foto-strip.png'], buttonLabel: '2' },
            { id: 'p3', title: 'Test Shot', text: 'Vår aller første møte med utstyret. Vi går ut og tester kameraer, linser og lyssetting for å finne ut hvordan vi fanger det perfekte bildet.'
            , images: ['Assets\\elementer\\photo strip\\testshots-foto-strip.png'], buttonLabel: '3' },
            { id: 'p4', title: 'Get Focused', text: 'Vi dro på en stor festival med over 3000 deltakere og styrte hele flerkameraproduksjonen live på storskjermene.'
            , images: ['Assets\\elementer\\photo strip\\getfocused-fotostrip.png'], buttonLabel: '4' },
            { id: 'p5', title: 'Skole-NM', text: 'Da skolen arrangerte NM for anleggsgartnere, rigget vi opp full live-stream. Vi styrte kameraene og sendte konkurransen direkte ut til seerne.'
            , images: ['Assets\\elementer\\photo strip\\foto-strip-NM.png'], buttonLabel: '5' },
            { id: 'p6', title: 'Bedriftsbesøk', text: 'Vi dro på tur til TV2 for å se hvordan proffene jobber. Sykt gøy å se kontrollrommene og studioene vi vanligvis bare ser på skjermen.'
            , images: ['Assets\\elementer\\photo strip\\bedriftsbesøk-fotostrip.png'], buttonLabel: '6' },
            { id: 'p7', title: 'Portrett-oppgave', text: 'Vi lærer å fange personligheten til folk foran kamera. Her jobber vi med kult lys, fete bakgrunner og intervjuteknikk, både i studio og ute.'
            , images: ['Assets\\elementer\\photo strip\\portrett-fotostrip.png'], buttonLabel: '7' },
            { id: 'p8', title: 'Tønsberg Frikirke', text: 'Som en del av praksisen vår reiser vi til Tønsberg Frikirke og filmer live.'
            , images: ['Assets\\elementer\\photo strip\\tbg-fotostrip.png'], buttonLabel: '8' },
            { id: 'p9', title: 'Filmplakater', text: 'Vi tar egne bilder og bruker Photoshop til å lage fete filmplakater. Her lærer vi triksene som gjør at plakaten gir skikkelig Hollywood-vibes.'
            , images: ['Assets\\elementer\\photo strip\\lanplakat-foto-strip.png'], buttonLabel: '9' }
        ];

        const projectButtons = document.getElementById('projectButtons');
        const printButton = document.getElementById('printButton');
        const paperOutput = document.getElementById('paperOutput');
        const projectTitle = document.getElementById('projectTitle');
        const projectText = document.getElementById('projectText');

        let activeProjectIndex = 0;
        let hasPrinted = false;

        function renderButtons() {
            projectButtons.innerHTML = projects.map((project, index) => {
                // Henter riktig bilde basert på tallet (1, 2, 3...)
                const buttonImage = `Assets/elementer/knapper/knapper til photobooth-${project.buttonLabel}.png`;
                
                return `
                    <div class="key-wrap">
                        <button class="project-key" type="button" data-index="${index}" style="background-image: url('${buttonImage}');">
                            </button>
                        <div class="key-label">${project.title}</div>
                    </div>
                `;
            }).join('');

            projectButtons.querySelectorAll('.project-key').forEach((button) => {
                button.addEventListener('click', () => {
                    activeProjectIndex = Number(button.dataset.index);
                    hasPrinted = false;
                    updateInfo();
                    clearProject();
                });
            });
        }
     
        

        function updateInfo() {
            const project = projects[activeProjectIndex];
            projectTitle.textContent = project.title;
            projectText.textContent = project.text;

            projectButtons.querySelectorAll('.project-key').forEach((button) => {
                button.classList.toggle('is-selected', Number(button.dataset.index) === activeProjectIndex);
            });
        }

        function clearProject() {
            hasPrinted = false;
            paperOutput.innerHTML = '';
        }

        function showProject() {
            const project = projects[activeProjectIndex];
            hasPrinted = true;
            paperOutput.innerHTML = `
                <div class="paper-grid">
                    ${project.images.map((source, index) => `
                        <figure class="photo"><img src="${source}" alt="${project.title} ${index + 1}"></figure>
                    `).join('')}
                </div>
            `;
            document.querySelectorAll('.photo').forEach((container) => {
                setTimeout(() => {
                    // Dette drar scrollen ned til bunnen av arket med en gang det printes
                    container.scrollTop = container.scrollHeight;
                }, 30); // Økt ørlite grann så bildet rekker å lastes inn ordentlig i nettleseren først
            });

            requestAnimationFrame(() => {
                const grabber = document.querySelector('.picture-grabber');
                if (!grabber) {
                    return;
                }

                // ensure grabber width variable is up to date before animating images
                syncGrabberWidth();

                const grabberRect = grabber.getBoundingClientRect();
        
        // --- ENDRING HER: Mål grabberens faktiske midtpunkt ---
        const grabberCenterX = grabberRect.left + (grabberRect.width / 2);
        const grabberCenterY = grabberRect.top + (grabberRect.height / 2);
        // ----------------------------------------------------

        requestAnimationFrame(() => {
            document.querySelectorAll('.paper-grid .photo img').forEach((image) => {
                const imageRect = image.getBoundingClientRect();

                // --- ENDRING HER: Mål bildets faktiske midtpunkt ---
                const imageCenterX = imageRect.left + (imageRect.width / 2);
                const imageCenterY = imageRect.top + (imageRect.height / 2);
                // ---------------------------------------------------

                // Beregn avstanden (forskjellen) mellom midtpunktene
                const deltaX = grabberCenterX - imageCenterX;
                const deltaY = grabberCenterY - imageCenterY;

                // Start animasjonen med bildet perfekt sentrert og skalert ned
                image.style.transform = `translate(${deltaX}px, ${deltaY}px) scale(0.25)`;
                image.style.opacity = '0';

                // Tillat nettleseren å tegne startposisjonen før vi trigger animasjonen ut
                requestAnimationFrame(() => {
                    image.style.transform = '';
                    image.style.opacity = '';
                        });
                    });
                });
            });
        }

        printButton.addEventListener('click', () => {
            showProject();
        });

        function syncGrabberWidth() {
            const grabber = document.querySelector('.picture-grabber');
            if (!grabber) return;
            const img = grabber.querySelector('img') || grabber;
            const rect = img.getBoundingClientRect();
            if (rect.width > 0) {
                document.documentElement.style.setProperty('--grabber-width', `${Math.round(rect.width)}px`);
            }
        }

        window.addEventListener('resize', syncGrabberWidth);

        renderButtons();
        updateInfo();
        clearProject();
        syncGrabberWidth();
    </script>
