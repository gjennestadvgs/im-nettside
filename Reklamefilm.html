<!doctype html>
<html lang="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="terminal.css">
    <link rel="stylesheet" href="https://use.typekit.net/nar4tne.css">
    <style>
        body {
            margin: 0;
            padding: 30px 90px 90px 90px;
        }

        .flex-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 50px;
        }

        /* BILDE */

        .bilde-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        #bilde {
            width: 100%;
            max-width: min(1400px, 90vw);
            aspect-ratio: 16 / 9;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
            border-radius: 20px;
        }

        #bilde img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }


        /* INNHOLD */

        .main-content {
            width: 100%;
            max-width: 1700px;

            display: flex;
            gap: clamp(30px, 3vw, 60px);

            align-items: flex-start;
        }

        /* TEKST */

        .inhold {
            flex: 2;

            padding: 30px;
        }

        .inhold h1 {
            margin-top: 0;

            font-size: clamp(1.8rem, 1rem + 2.5vw, 4.5rem);

            letter-spacing: 2px;

            padding-bottom: 15px;
        }

        .inhold p {
            line-height: 1.8;

            font-size: clamp(1rem, 0.8rem + 0.7vw, 2rem);
        }

        /* BILDER */

        .bilde-kolonne {
            flex: 1;

            display: flex;
            flex-direction: column;

            gap: 20px;
        }

        .bilde-kolonne img {
            width: 100%;

            max-width: 480px;

            border-radius: 6px;
        }

        /* VIDEOER */

        .video-seksjon {
            width: 100%;
            max-width: 1700px;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
        }

        .video-grid iframe {
            width: 100%;
            aspect-ratio: 16 / 9;
            height: auto;

            border: none;
            border-radius: 12px;
        }

        /* TELEFON */

        @media (max-width: 768px) {

            .flex-container .back-button--fixed {
                position: static;
                align-self: flex-start;
            }

            body {
                padding: 20px 15px 40px 15px;
            }

            .flex-container {
                gap: 30px;
            }

            #bilde {
                border-radius: 12px;
            }

            .main-content {
                flex-direction: column;
                gap: 25px;
            }

            .inhold {
                padding: 0;
            }

            .inhold h1 {
                font-size: 1.8rem;
            }

            .inhold p {
                font-size: 1rem;
            }

            .bilde-kolonne {
                align-items: center;
            }

            .video-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="flex-container">

        <button class="back-button back-button--fixed" aria-label="Tilbake"></button>

        <div class="bilde-wrapper">
            <div id="bilde"></div>
        </div>

        <div class="back-title-band">
            <h1 id="prosjekt-tittel"></h1>
        </div>

        <!-- TEKST + BILDE -->
        <div class="main-content">

            <div class="inhold" id="inhold"></div>

            <div class="bilde-kolonne" id="bilde-kolonne"></div>

        </div>

        <!-- VIDEOER (under teksten) -->
        <div class="video-seksjon">
            <div class="video-grid" id="video-grid"></div>
        </div>

    </div>

    <script>

        const prosjekter = [
            {
                id: "Reklamefilm",

                tittel: "Reklamefilm",

                bilde: "Assets/bilder/filmplakat_above-the-law.jpg",

                tekstfil: "Assets/tekst/Reklamefilm",

                forside: "Assets/bilder/1IM_2026_1.jpg",

                // Fire YouTube-videoer. Bytt ut ID-ene (delen etter "embed/").
                videoer: [
                    "https://www.youtube.com/embed/dQw4w9WgXcQ",
                    "https://www.youtube.com/embed/dQw4w9WgXcQ",
                    "https://www.youtube.com/embed/dQw4w9WgXcQ",
                    "https://www.youtube.com/embed/dQw4w9WgXcQ"
                ]
            },
        ];

        // FINN URL PARAMETER

        function getQueryParam(name) {

            const url = new URL(window.location.href);

            return url.searchParams.get(name);
        }

        // LAST SIDE

        function visProsjekt() {

            const id = getQueryParam('id');

            const prosjekt =
                prosjekter.find(p => p.id === id);

            if (!prosjekt) {

                document.getElementById('prosjekt-tittel').textContent = 'Prosjekt ikke funnet';

                document.querySelector('.inhold').innerHTML =
                    "";

                return;
            }

            document.getElementById('prosjekt-tittel').textContent = prosjekt.tittel;

            // BILDE

            document.querySelector('.bilde-kolonne').innerHTML = `
                <img src="${prosjekt.bilde}">
            `;

            document.getElementById('bilde').innerHTML = `
                <img src="${prosjekt.forside || prosjekt.bilde}" alt="${prosjekt.tittel}">
            `;

            // VIDEOER

            document.getElementById('video-grid').innerHTML =
                (prosjekt.videoer || [])
                    .map(url => `
                        <iframe
                            src="${url}"
                            title="${prosjekt.tittel}"
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                            allowfullscreen>
                        </iframe>
                    `)
                    .join('');

            // TEKST

            fetch(prosjekt.tekstfil)

                .then(response => response.text())

                .then(data => {

                    const avsnitt = data

                        .split(/\n\s*\n/)

                        .map(a => `<p>${a.trim()}</p>`)

                        .join('');

                    document.querySelector('.inhold').innerHTML = `
                        ${avsnitt}
                    `;
                });

        }

        document.addEventListener(
            'DOMContentLoaded',
            visProsjekt
        );

    </script>
<script src="script.js"></script>
    <script src="back-button.js"></script>
<script src="terminal.js"></script>
<script src="kommandoer.js"></script>

</html>
</body>
