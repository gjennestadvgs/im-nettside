<!doctype html>
<html lang="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="terminal.css">
    <link rel="stylesheet" href="https://use.typekit.net/nar4tne.css">
    <style>
        body {
            margin: 0;
            padding: 30px 90px 90px 90px;
        }

        .flex-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 50px;
        }

        /* BILDE */

        .bilde-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        #bilde {
            width: 100%;
            max-width: min(1400px, 90vw);
            aspect-ratio: 16 / 9;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
            border-radius: 20px;
        }

        #bilde img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }


        /* INNHOLD */

        .main-content {
            width: 100%;
            max-width: 1700px;

            display: flex;
            flex-direction: column;

            gap: clamp(50px, 6vw, 100px);
        }

        /* AVSNITT (rad med tekst + bilder) */

        .avsnitt-rad {
            width: 100%;

            display: flex;
            gap: clamp(30px, 3vw, 60px);

            align-items: center;
        }

        /* annenhver avsnitt bytter side */

        .avsnitt-rad:nth-child(even) {
            flex-direction: row-reverse;
        }

        /* TEKST */

        .inhold {
            flex: 2;

            padding: 30px;
        }

        .inhold h1 {
            margin-top: 0;

            font-size: clamp(1.8rem, 1rem + 2.5vw, 4.5rem);

            letter-spacing: 2px;

            padding-bottom: 15px;
        }

        .inhold p {
            line-height: 1.8;

            font-size: clamp(1rem, 0.8rem + 0.7vw, 2rem);
        }

        /* BILDER */

        .bilder {
            flex: 1.4;

            display: flex;
            flex-direction: column;

            gap: 20px;
        }

        .bilder img {
            width: 100%;

            max-width: 600px;

            border-radius: 6px;
        }

        /* mange små bilder = logoer */

        .bilder.logoer {
            flex-direction: row;
            flex-wrap: nowrap; /* alle logoene på én linje */

            justify-content: center;

            gap: 14px;
        }

        .bilder.logoer img {
            /* Del bredden likt og la dem krympe, så alle får plass på én linje
               uansett antall. aspect-ratio holder hver logo kvadratisk. */
            flex: 1 1 0;
            min-width: 0;
            width: auto;
            height: auto;
            max-width: 140px;
            aspect-ratio: 1 / 1;

            object-fit: contain;

            /* hvit firkant rundt hver logo */
            background-color: #fff;
            padding: 12px;
            box-sizing: border-box;
            border-radius: 8px;
        }

        /* flere filmplakater = rutenett med portrettbilder */

        .bilder.plakater {
            flex-direction: row;
            flex-wrap: wrap;

            display: grid;
            grid-template-columns: repeat(2, 1fr);

            gap: 16px;
        }

        .bilder.plakater img {
            width: 100%;
            max-width: none;

            aspect-ratio: 2 / 3;
            object-fit: cover;
        }

        /* MOBIL */

        @media (max-width: 768px) {
            .flex-container .back-button--fixed {
                position: static;
                align-self: flex-start;
            }

            body {
                padding: 20px 15px 40px 15px;
            }

            .flex-container {
                gap: 30px;
            }

            #bilde {
                border-radius: 12px;
            }

            .main-content {
                gap: 45px;
            }

            /* alltid tekst over bilder på mobil */

            .avsnitt-rad,
            .avsnitt-rad:nth-child(even) {
                flex-direction: column;
                gap: 25px;
            }

            .inhold {
                padding: 0;
            }

            .inhold h1 {
                font-size: 1.8rem;
            }

            .inhold p {
                font-size: 1rem;
            }

            .bilder {
                align-items: center;
            }

            /* Hold logo-raden innenfor skjermen: full bredde + tillat krymping,
               ellers flyter de nowrap-logoene utenfor på telefon. */
            .bilder.logoer {
                width: 100%;
                max-width: 100%;
                box-sizing: border-box;
                gap: 8px;
            }
        }
    </style>
</head>

<body>

    <div class="flex-container">

        <button class="back-button back-button--fixed" aria-label="Tilbake"></button>

        <div class="bilde-wrapper">
            <div id="bilde"></div>
        </div>

        <div class="back-title-band">
            <h1 id="prosjekt-tittel"></h1>
        </div>

        <!-- AVSNITT (tekst + bilder, bytter side) -->
        <div class="main-content" id="main-content"></div>

    </div>

    <script>

        const prosjekter = [
            {
                id: "Grafisk-Design",

                tittel: "Grafisk design",

                bilde: "Assets/bilder/filmplakat_above-the-law.jpg",

                tekstfil: "Assets/tekst/Grafisk-Design.txt",

                forside: "Assets/bilder/GrafiskMontasje.jpg",

                // bilder for hvert avsnitt (avsnitt deles med "--" i tekstfila)
                // 3 eller flere bilder vises som små logoer
                avsnittBilder: [

                    // avsnitt 1: små logoer
                    [
                        "Assets/bilder/logoer/northbyte-v2-23.png",
                        "Assets/bilder/logoer/NorthByteLogoClean-1.png",
                        "Assets/bilder/logoer/New_Northbyte_Games_V4_BlackNWhite-1.png",
                        "Assets/bilder/logoer/PulseZone-1.png",
                        "Assets/bilder/logoer/Logo_Kasper-1.png"
                    ],

                    // avsnitt 2
                    [
                        "Assets/bilder/Filmplakat_above-the-law.jpg",
                        "Assets/bilder/filmplakater/Gresk Antikk-v4.jpg",
                        "Assets/bilder/filmplakater/LanPoster.jpg",
                        "Assets/bilder/filmplakater/Lan_poster_oppgave.jpg",
                        "Assets/bilder/filmplakater/OperationUnknown.png",
                        "Assets/bilder/filmplakater/viking-tiden.png"
                    ],

                    // avsnitt 3
                ]
            },
        ];

        // FINN URL PARAMETER

        function getQueryParam(name) {

            const url = new URL(window.location.href);

            return url.searchParams.get(name);
        }

        // LAST SIDE

        function visProsjekt() {

            const id = getQueryParam('id');

            const prosjekt =
                prosjekter.find(p => p.id === id);

            if (!prosjekt) {

                document.getElementById('prosjekt-tittel').textContent = 'Prosjekt ikke funnet';

                document.getElementById('main-content').innerHTML = "";

                return;
            }

            document.getElementById('prosjekt-tittel').textContent = prosjekt.tittel;

            // FORSIDEBILDE

            document.getElementById('bilde').innerHTML = `
                <img src="${prosjekt.forside || prosjekt.bilde}" alt="${prosjekt.tittel}">
            `;

            // TEKST + BILDER (avsnitt deles med "--")

            fetch(prosjekt.tekstfil)

                .then(response => response.text())

                .then(data => {

                    const avsnitt = data

                        .split('--')

                        .map(a => a.trim())

                        .filter(a => a.length > 0);

                    const bildeGrupper = prosjekt.avsnittBilder || [];

                    document.getElementById('main-content').innerHTML = avsnitt

                        .map((tekst, i) => {

                            // del avsnittet i mindre tekstbiter på blanke linjer
                            const tekstHtml = tekst
                                .split(/\n\s*\n/)
                                .map(p => `<p>${p.trim()}</p>`)
                                .join('');

                            const bilder = bildeGrupper[i] || [];

                            // bilder i /logoer/ = små logoer, ellers flere bilder = plakat-rutenett
                            const erLogoer = bilder.length >= 3
                                && bilder.every(src => src.includes('/logoer/'));

                            const erPlakater = !erLogoer && bilder.length >= 2;

                            const bilderHtml = bilder
                                .map(src => `<img src="${src}" alt="">`)
                                .join('');

                            const bilderKlasse = erLogoer
                                ? ' logoer'
                                : (erPlakater ? ' plakater' : '');

                            return `
                                <div class="avsnitt-rad">
                                    <div class="inhold">${tekstHtml}</div>
                                    <div class="bilder${bilderKlasse}">${bilderHtml}</div>
                                </div>
                            `;
                        })

                        .join('');
                });

        }

        document.addEventListener(
            'DOMContentLoaded',
            visProsjekt
        );

    </script>
<script src="script.js"></script>
    <script src="back-button.js"></script>
<script src="terminal.js"></script>
<script src="kommandoer.js"></script>

</html>
</body>
