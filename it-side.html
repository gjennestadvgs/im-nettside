<!doctype html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prosjekt</title>
  <style>
    /* RESET & BASE */
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      /* Make body take full viewport height */
      min-height: 100vh;
      /* Center content vertically and horizontally */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      /* Optional: Dark background to match your text color */
      background-color: #121212;
      color: #ddd;
      overflow-x: hidden; /* Prevent horizontal scroll from the border */
    }

    /* BACKGROUND BORDER */
    .border {
      position: absolute;
      bottom: 95vh;
      left: 0;
      width: 150%;
      /* Center the 150% width element */
      transform: translateX(-25%);
    }

    /* MAIN CONTAINER */
    .flex-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 50px;
      width: 100%;
      max-width: 1400px;
      padding: 40px 20px; /* Padding for mobile/desktop spacing */
      /* Ensure the container doesn't exceed screen width */
      margin: 0 auto;
    }

    /* VIDEO SECTION */
    .player-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }

    #player {
      width: 100%;
      max-width: 800px;
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 20px;
      background: #000;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    #player iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      outline: none;
    }

    /* CONTENT SECTION (TEXT + IMAGES) */
    .main-content {
      width: 100%;
      display: flex;
      gap: 40px;
      align-items: flex-start;
      flex-wrap: wrap; /* Allow stacking on small screens */
    }

    /* TEXT COLUMN */
    .inhold {
      flex: 2;
      min-width: 300px;
      padding: 30px;
    }

    .inhold h1 {
      margin-top: 0;
      font-size: 2.4rem;
      letter-spacing: 2px;
      padding-bottom: 15px;
      color: #fff;
    }

    .inhold p {
      line-height: 1.8;
      color: #ddd;
      font-size: 1.1rem;
      margin-bottom: 1.5rem;
    }

    /* IMAGE COLUMN */
    .bilde-kolonne {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
      min-width: 250px;
    }

    .bilde-kolonne img {
      width: 100%;
      max-width: 350px;
      border-radius: 6px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      object-fit: cover;
    }

    /* RESPONSIVE TWEAKS */
    @media (max-width: 768px) {
      .main-content {
        flex-direction: column;
        align-items: center;
        gap: 30px;
      }

      .inhold {
        width: 100%;
        text-align: center;
      }

      .inhold h1 {
        font-size: 2rem;
      }

      .bilde-kolonne {
        width: 100%;
        max-width: 400px;
      }
    }
  </style>
  
  <!-- External stylesheets (keep if you have them, otherwise remove) -->
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="terminal.css">
</head>
<body>

  <!-- Background Border -->
  <img src="Assets\border\Test-border.svg" class="border" alt="decorative border">

  <div class="flex-container">
    
    <!-- VIDEO SECTION -->
    <div class="player-wrapper">
      <div id="player"></div>
    </div>

    <!-- TEXT + IMAGE SECTION -->
    <div class="main-content">
      <div class="inhold" id="inhold"></div>
      <div class="bilde-kolonne" id="bilde-kolonne"></div>
    </div>

  </div>

  <script>
    // Project Data
    const prosjekter = [
      {
        id: "test-id",
        tittel: "Above The Law",
        bilde: "Assets/bilder/filmplakat_above-the-law.jpg",
        videoEmbed: `
          <iframe 
            width="560" 
            height="315" 
            src="https://www.youtube.com/embed/yv3bVFX2lXA?si=D0rhYQHylAjppMyq&autoplay=1&mute=1&playsinline=1" 
            title="YouTube video player" 
            frameborder="0" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
            referrerpolicy="strict-origin-when-cross-origin" 
            allowfullscreen>
          </iframe>
        `,
        tekstfil: "Assets/tekst/test.txt",
      }
    ];

    // Helper: Get URL Parameter
    function getQueryParam(name) {
      const url = new URL(window.location.href);
      return url.searchParams.get(name);
    }

    // Main Function: Load Project
    function visProsjekt() {
      const id = getQueryParam('id');
      const prosjekt = prosjekter.find(p => p.id === id);

      if (!prosjekt) {
        document.querySelector('.inhold').innerHTML = "<h1>Prosjekt ikke funnet</h1>";
        document.querySelector('.bilde-kolonne').innerHTML = "";
        return;
      }

      // 1. Load Image
      const bildeContainer = document.querySelector('.bilde-kolonne');
      if (bildeContainer) {
        bildeContainer.innerHTML = `<img src="${prosjekt.bilde}" alt="${prosjekt.tittel}">`;
      }

      // 2. Load Text
      const tekstContainer = document.querySelector('.inhold');
      if (tekstContainer) {
        // Set title immediately
        tekstContainer.innerHTML = `<h1>${prosjekt.tittel}</h1> Loading...`;
        
        fetch(prosjekt.tekstfil)
          .then(response => {
            if (!response.ok) throw new Error('Filen kunne ikke lastes');
            return response.text();
          })
          .then(data => {
            // Split text into paragraphs (handling empty lines)
            const avsnitt = data
              .split(/\n\s*\n/)
              .filter(paragraph => paragraph.trim().length > 0) // Avoid empty paragraphs
              .map(a => `<p>${a.trim()}</p>`)
              .join('');
            
            // Replace content
            tekstContainer.innerHTML = `<h1>${prosjekt.tittel}</h1>${avsnitt}`;
          })
          .catch(error => {
            console.error('Feil ved lasting:', error);
            tekstContainer.innerHTML = `<h1>${prosjekt.tittel}</h1><p>Kunne ikke laste teksten.</p>`;
          });
      }

      // 3. Load Video
      const playerContainer = document.querySelector('#player');
      if (playerContainer) {
        playerContainer.innerHTML = prosjekt.videoEmbed;
      }
    }

    // Initialize on DOM Load
    document.addEventListener('DOMContentLoaded', visProsjekt);
  </script>

  <!-- External scripts (keep if you have them, otherwise remove) -->
  <script src="script.js"></script>
  <script src="terminal.js"></script>
  <script src="kommandoer.js"></script>
</body>
</html>
