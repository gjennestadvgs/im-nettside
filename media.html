<!doctype html>
<html lang="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            padding: 10px 30px 30px 30px;
        }

        .flex-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 50px;
        }

        /* VIDEO */

        .player-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        #player {
            width: 100%;
            max-width: min(1400px, 90vw);
            aspect-ratio: 16 / 9;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
            border-radius: 20px;
        }

        #player iframe {
            display: block;
            width: 101%;
            height: 101%;
            position: relative;
            margin: 0;
            border: 0;
            outline: none;
            background: transparent;
        }

        /* INNHOLD */

        .main-content {
            width: 100%;
            max-width: 1700px;

            display: flex;
            gap: clamp(30px, 3vw, 60px);

            align-items: flex-start;
        }

        /* TEKST */

        .tekst-kolonne {
            flex: 2;

            display: flex;
            flex-direction: column;

            gap: 30px;
        }

        .inhold {
            flex: 0 1 auto;

            padding: 30px;
        }

        /* STORT BILDE UNDER TEKSTEN */

        .stor-bilde {
            padding: 0 30px;
        }

        .stor-bilde img {
            width: 100%;

            border-radius: 6px;

            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.35);

            transform: rotate(-1.5deg);

            transition: transform 200ms ease;
        }

        .stor-bilde img:hover {
            transform: rotate(0deg) scale(1.02);
        }

        .inhold h1 {
            margin-top: 0;

            font-size: clamp(1.8rem, 1rem + 2.5vw, 4.5rem);

            letter-spacing: 2px;

            padding-bottom: 15px;
        }

        .inhold p {
            line-height: 1.8;
            font-size: clamp(1rem, 0.8rem + 0.7vw, 2rem);
        }

        /* BILDER */

        .bilde-kolonne {
            flex: 1;

            display: flex;
            flex-direction: column;

            gap: 20px;
        }

        .bilde-kolonne img {
            width: 100%;

            max-width: 480px;

            border-radius: 6px;

            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);

            transition: transform 200ms ease;
        }

        /* SPREDT COLLAGE: ulike størrelser og plasseringer per bilde */
        .bilde-kolonne { gap: 30px; }
        .bilde-kolonne img:nth-child(4n+1) { width: 100%; align-self: flex-start; transform: rotate(-3deg); }
        .bilde-kolonne img:nth-child(4n+2) { width: 64%;  align-self: flex-end;   transform: rotate(2.5deg); margin-top: -6px; }
        .bilde-kolonne img:nth-child(4n+3) { width: 82%;  align-self: center;     transform: rotate(-1.5deg); }
        .bilde-kolonne img:nth-child(4n+4) { width: 54%;  align-self: flex-start; transform: rotate(3.5deg); margin-left: 14%; }
        .bilde-kolonne img:hover { transform: rotate(0deg) scale(1.04); z-index: 2; }

        /* MOBIL */

        @media (max-width: 768px) {
            .flex-container .back-button--fixed {
                position: static;
                align-self: flex-start;
            }

            body {
                padding: 10px 15px 30px 15px;
            }

            .flex-container {
                gap: 30px;
            }

            #player {
                border-radius: 12px;
            }

            .main-content {
                flex-direction: column;
                gap: 25px;
            }

            .inhold {
                padding: 0;
            }

            .stor-bilde {
                padding: 0;
            }

            .inhold h1 {
                font-size: 1.8rem;
            }

            .inhold p {
                font-size: 1rem;
            }

            .bilde-kolonne {
                align-items: center;
            }
        }
        </style>
        <link rel="stylesheet" href="https://use.typekit.net/nar4tne.css">
        <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="terminal.css">
</head>

<body>

    <div class="flex-container">

        <button class="back-button back-button--fixed" aria-label="Tilbake"></button>

        <!-- VIDEO -->
        <div class="player-wrapper">
            <div id="player"></div>
        </div>

        <div class="back-title-band">
            <h1 id="prosjekt-tittel"></h1>
        </div>

        <!-- TEKST + BILDE -->
        <div class="main-content">

            <div class="tekst-kolonne">
                <div class="inhold" id="inhold"></div>
                <div class="stor-bilde" id="stor-bilde"></div>
            </div>

            <div class="bilde-kolonne" id="bilde-kolonne"></div>

        </div>

    </div>

    <script>

        const prosjekter = [
            {
                id: "media",

                tittel: "Media",

                bilder: [
                    "Assets/bilder/medie%20bilder/foto_med_model_v1.jpg",
                    "Assets/bilder/medie%20bilder/1IM_2026_34.JPG",
                    "Assets/bilder/medie%20bilder/1017B021-51CD-4FF3-A720-6ECE20779975.JPG",
                    "Assets/bilder/medie%20bilder/3438987D-A19D-4913-ABE5-44FA9D4BD554.JPG"
                ],

                videoEmbed: `<iframe width="560" height="315" src="https://www.youtube.com/embed/PDOXalyZSPo?si=xivrMl3sCR7dsBGo&autoplay=1&mute=1&playsinline=1" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>`,

                tekstfil: "Assets/tekst/medieproduksjon",
            },
        ];

        // FINN URL PARAMETER

        function getQueryParam(name) {

            const url = new URL(window.location.href);

            return url.searchParams.get(name);
        }

        // LAST SIDE

        function visProsjekt() {

            const id = getQueryParam('id');

            const prosjekt =
                prosjekter.find(p => p.id === id);

            if (!prosjekt) {

                document.getElementById('prosjekt-tittel').textContent = 'Prosjekt ikke funnet';

                document.querySelector('.inhold').innerHTML =
                    "";

                return;
            }

            document.getElementById('prosjekt-tittel').textContent = prosjekt.tittel;

            // BILDE

            // Første bilde stort under teksten, resten i side-kolonnen
            document.querySelector('#stor-bilde').innerHTML = prosjekt.bilder.length
                ? `<img src="${prosjekt.bilder[0]}">`
                : '';

            document.querySelector('.bilde-kolonne').innerHTML = prosjekt.bilder
                .slice(1)
                .map(src => `<img src="${src}">`)
                .join('');

            // TEKST

            fetch(prosjekt.tekstfil)

                .then(response => response.text())

                .then(data => {

                    const avsnitt = data

                        .split(/\n\s*\n/)

                        .map(a => `<p>${a.trim()}</p>`)

                        .join('');

                    document.querySelector('.inhold').innerHTML = `
                        ${avsnitt}
                    `;
                });

            // VIDEO

            document.querySelector('#player').innerHTML = prosjekt.videoEmbed;
        }

        document.addEventListener(
            'DOMContentLoaded',
            visProsjekt
        );

    </script>
<script src="script.js"></script>
    <script src="back-button.js"></script>
<script src="terminal.js"></script>
<script src="kommandoer.js"></script>
<script src="lightbox.js"></script>

</html>
</body>
