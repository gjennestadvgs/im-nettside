<!doctype html>
<html lang="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            padding: 10px 30px 30px 30px;
        }

        .flex-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 50px;
        }

        /* VIDEO */

        .player-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        #player {
            width: 100%;
            max-width: min(1400px, 90vw);
            aspect-ratio: 16 / 9;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
            border-radius: 20px;
        }

        #player iframe {
            display: block;
            width: 101%;
            height: 101%;
            position: relative;
            margin: 0;
            border: 0;
            outline: none;
            background: transparent;
        }

        /* INNHOLD */

        .main-content {
            width: 100%;
            max-width: 1700px;

            display: flex;
            gap: clamp(30px, 3vw, 60px);

            align-items: flex-start;
        }

        /* TEKST */

        .inhold {
            flex: 2;

            padding: 30px;
        }

        .inhold h1 {
            margin-top: 0;

            font-size: clamp(1.8rem, 1rem + 2.5vw, 4.5rem);

            letter-spacing: 2px;

            padding-bottom: 15px;
        }

        .inhold p {
            line-height: 1.8;
            font-size: clamp(1rem, 0.8rem + 0.7vw, 2rem);
        }

        /* BILDER */

        .bilde-kolonne {
            flex: 1;

            display: flex;
            flex-direction: column;

            gap: 20px;
        }

        .bilde-kolonne img {
            width: 100%;

            max-width: 480px;

            border-radius: 6px;
        }

        /* MOBIL */

        @media (max-width: 768px) {
            .flex-container .back-button--fixed {
                position: static;
                align-self: flex-start;
            }

            body {
                padding: 10px 15px 30px 15px;
            }

            .flex-container {
                gap: 30px;
            }

            #player {
                border-radius: 12px;
            }

            .main-content {
                flex-direction: column;
                gap: 25px;
            }

            .inhold {
                padding: 0;
            }

            .inhold h1 {
                font-size: 1.8rem;
            }

            .inhold p {
                font-size: 1rem;
            }

            .bilde-kolonne {
                align-items: center;
            }
        }
        </style>
        <link rel="stylesheet" href="https://use.typekit.net/nar4tne.css">
        <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="terminal.css">
</head>

<body>

    <div class="flex-container">

        <button class="back-button back-button--fixed" aria-label="Tilbake"></button>

        <!-- VIDEO -->
        <div class="player-wrapper">
            <div id="player"></div>
        </div>

        <div class="back-title-band">
            <h1 id="prosjekt-tittel"></h1>
        </div>

        <!-- TEKST + BILDE -->
        <div class="main-content">

            <div class="inhold" id="inhold"></div>

            <div class="bilde-kolonne" id="bilde-kolonne"></div>

        </div>

    </div>

    <script>

        const prosjekter = [
            {
                id: "Internat og Gjennestad",

                tittel: "Internat og Gjennestad",

                bilde: "Assets/bilder/filmplakat_above-the-law.jpg",

                videoEmbed: `<iframe width="560" height="315" src="https://www.youtube.com/embed/yv3bVFX2lXA?si=D0rhYQHylAjppMyq&autoplay=1&mute=1&playsinline=1" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>`,

                tekstfil: "Assets/tekst/Internat og Gjennestad",
            },
            {
                id: "Praksis",

                tittel: "Yrkespraksis",

                bilde: "Assets/bilder/filmplakat_above-the-law.jpg",

                videoEmbed: `<iframe width="560" height="315" src="https://www.youtube.com/embed/yv3bVFX2lXA?si=D0rhYQHylAjppMyq&autoplay=1&mute=1&playsinline=1" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>`,

                tekstfil: "Assets/tekst/Yrkespraksis.txt",
            }
        ];

        // FINN URL PARAMETER

        function getQueryParam(name) {

            const url = new URL(window.location.href);

            return url.searchParams.get(name);
        }

        // LAST SIDE

        function visProsjekt() {

            const id = getQueryParam('id');

            const prosjekt =
                prosjekter.find(p => p.id === id);

            if (!prosjekt) {

                document.getElementById('prosjekt-tittel').textContent = 'Prosjekt ikke funnet';

                document.querySelector('.inhold').innerHTML =
                    "";

                return;
            }

            document.getElementById('prosjekt-tittel').textContent = prosjekt.tittel;

            // BILDE

            document.querySelector('.bilde-kolonne').innerHTML = `
                <img src="${prosjekt.bilde}">
            `;

            // TEKST

            fetch(prosjekt.tekstfil)

                .then(response => response.text())

                .then(data => {

                    const avsnitt = data

                        .split(/\n\s*\n/)

                        .map(a => `<p>${a.trim()}</p>`)

                        .join('');

                    document.querySelector('.inhold').innerHTML = `
                        ${avsnitt}
                    `;
                });

            // VIDEO

            document.querySelector('#player').innerHTML = prosjekt.videoEmbed;
        }

        document.addEventListener(
            'DOMContentLoaded',
            visProsjekt
        );

    </script>
<script src="script.js"></script>
    <script src="back-button.js"></script>
<script src="terminal.js"></script>
<script src="kommandoer.js"></script>

</html>
</body>
